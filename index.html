<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指宿ひまわり開花情報</title>
<style>
:root{--green:#287747;--soft:#f5f7f2;--text:#243127;--muted:#6f786f}
*{box-sizing:border-box}
body{margin:0;background:#edf0ec;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.phone{max-width:430px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 30px #0002}
.hero{height:390px;position:relative;color:#fff;background:linear-gradient(#0002,#0009),url("https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=1200&q=88") center/cover}
.header{padding:18px;display:flex;justify-content:space-between;font-weight:800}
.heroText{position:absolute;left:20px;right:20px;bottom:25px}
.heroText small{letter-spacing:.12em}.heroText h1{font-size:31px;line-height:1.18;margin:8px 0}.heroText p{margin:0;font-size:14px}
main{padding:22px 17px 95px}.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;margin:0 0 13px}.muted{font-size:11px;color:var(--muted)}
.feature{overflow:hidden;border-radius:20px;background:var(--soft);border:1px solid #e7ebe5}.featureImg{height:205px;background:center/cover no-repeat}.featureBody{padding:15px}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#e2f1e5;color:var(--green);font-size:12px;font-weight:800}.feature h2{font-size:20px;margin:8px 0 4px}.feature p{margin:0;color:#68736b;font-size:13px;line-height:1.6}
.info{margin-top:25px}.spotlink{text-decoration:none;color:inherit;display:block}.spot{display:flex;align-items:center;padding:14px 12px;border:1px solid #e4e8e3;border-radius:15px;margin:9px 0;background:#fff}.dot{width:11px;height:11px;border-radius:50%;margin-right:11px;flex:0 0 auto}.spot strong{font-size:14px}.spot small{display:block;color:#778078;font-size:11px;margin-top:3px;line-height:1.45}.rate{margin-left:auto;font-size:12px;white-space:nowrap}.arrow{margin-left:8px;color:#9aa39a}
.mapbox{margin-top:25px}.map{height:165px;border-radius:18px;background:linear-gradient(135deg,#e5ecdf,#d5e5df);position:relative;overflow:hidden;border:1px solid #dce5d9}.map:before{content:"";position:absolute;width:125%;height:9px;background:#fff;transform:rotate(-17deg);top:78px;left:-25px;box-shadow:0 0 0 1px #d2dad0}.lake{position:absolute;width:130px;height:80px;background:#b8dce3;border-radius:50%;right:30px;top:18px}.pin{position:absolute;font-size:25px}.a{left:70px;top:85px}.b{right:100px;top:90px}.c{left:180px;top:40px}.btn{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;padding:13px;border-radius:13px;margin-top:10px;font-size:14px;font-weight:800}
.guide{margin-top:24px;padding:14px;border-radius:15px;background:#f7f8f5;border:1px solid #e4e8e3;font-size:12px;line-height:1.7}.guide b{font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e4e8e3;padding:9px 3px 11px;z-index:4}nav div{text-align:center;color:#788179;font-size:10px}nav b{display:block;font-size:18px;color:var(--green);margin-bottom:2px}
@media(min-width:500px){.phone{margin:24px auto;border-radius:28px;overflow:hidden}nav{position:sticky;left:auto;transform:none}}
</style>
</head>
<body>
<div class="phone">
<section class="hero">
  <div class="header"><span>🌻 指宿ひまわり開花情報</span><span>☰</span></div>
  <div class="heroText"><small>IBUSUKI · KAGOSHIMA</small><h1>今日、どこが<br>見ごろ？</h1><p>指宿市内のひまわりを、ひとつのサイトに。</p></div>
</section>

<main>
  <div class="row"><h2 class="title">🌻 今日の一枚</h2><span class="muted" id="siteUpdated"></span></div>
  <article class="feature">
    <div class="featureImg" id="mainPhoto"></div>
    <div class="featureBody">
      <span class="pill" id="mainStatus"></span>
      <h2 id="mainPlace"></h2>
      <p id="mainComment"></p>
    </div>
  </article>

  <section class="info">
    <div class="row"><h2 class="title">現在の開花状況</h2><span class="muted">3スポット</span></div>
    <div id="spots"></div>
  </section>

  <section class="mapbox">
    <h2 class="title">📍 ひまわりマップ</h2>
    <div class="map"><div class="lake"></div><span class="pin a">📍</span><span class="pin b">🌻</span><span class="pin c">📍</span></div>
    <a class="btn" id="mapLink" target="_blank" rel="noopener">3スポットをGoogleマップで探す →</a>
  </section>

  <div class="guide">
    <b>📍 場所の目印</b><br>
    山川岡児ケ水：湯通堂青果 山川事業所（倉庫裏付近）<br>
    池田湖：中浜営農研修センター（中浜公民館）の道路向かい<br>
    JR西大山駅：駅周辺
  </div>
</main>

<nav><div><b>⌂</b>ホーム</div><div><b>🌻</b>開花情報</div><div><b>📍</b>マップ</div><div><b>📷</b>写真</div><div><b>＋</b>投稿</div></nav>
</div>

<script>
/* ===== 編集エリア：ここだけ変更すればOK ===== */
const DATA = {
  updated: "2026.8.8 更新",
  main: {
    place: "山川岡児ケ水",
    status: "● 見ごろ",
    comment: "湯通堂青果 山川事業所の倉庫裏付近。開聞岳とひまわりを一緒に楽しめる、指宿らしい夏の風景。",
    photo: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=1200&q=88"
  },
  spots: [
    {
      place:"山川岡児ケ水",
      landmark:"湯通堂青果 山川事業所（倉庫裏付近）",
      status:"見ごろ", checked:"8/8確認", stars:"★★★★★", color:"#37a45b",
      map:"https://www.google.com/maps/search/?api=1&query=%E6%8C%87%E5%AE%BF%E5%B8%82%E5%B1%B1%E5%B7%9D%E5%B2%A1%E5%85%90%E3%82%B1%E6%B0%B4286-7"
    },
    {
      place:"池田湖",
      landmark:"中浜営農研修センター（中浜公民館）の道路向かい",
      status:"まもなく見ごろ", checked:"8/7確認", stars:"★★★★☆", color:"#e4b632",
      map:"https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E6%B5%9C%E5%96%B6%E8%BE%B2%E7%A0%94%E4%BF%AE%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC+%E6%8C%87%E5%AE%BF%E5%B8%82%E6%B1%A0%E7%94%B0"
    },
    {
      place:"JR西大山駅",
      landmark:"鹿児島県指宿市山川大山602",
      status:"咲き始め", checked:"8/7確認", stars:"★★☆☆☆", color:"#e78d3b",
      map:"https://www.google.com/maps/search/?api=1&query=JR%E8%A5%BF%E5%A4%A7%E5%B1%B1%E9%A7%85+%E6%8C%87%E5%AE%BF%E5%B8%82%E5%B1%B1%E5%B7%9D%E5%A4%A7%E5%B1%B1602"
    }
  ]
};
/* ===== 編集エリアここまで ===== */

document.getElementById("siteUpdated").textContent = DATA.updated;
document.getElementById("mainPlace").textContent = DATA.main.place;
document.getElementById("mainStatus").textContent = DATA.main.status;
document.getElementById("mainComment").textContent = DATA.main.comment;
document.getElementById("mainPhoto").style.backgroundImage = `url("${DATA.main.photo}")`;

const spots = document.getElementById("spots");
DATA.spots.forEach(s=>{
  const a = document.createElement("a");
  a.href=s.map; a.target="_blank"; a.rel="noopener"; a.className="spotlink";
  a.innerHTML=`<div class="spot">
    <i class="dot" style="background:${s.color}"></i>
    <div><strong>${s.place}</strong><small>${s.status} · ${s.checked}<br>📍 ${s.landmark}</small></div>
    <span class="rate">${s.stars}</span><span class="arrow">›</span>
  </div>`;
  spots.appendChild(a);
});

document.getElementById("mapLink").href =
  "https://www.google.com/maps/search/?api=1&query=%E3%81%B2%E3%81%BE%E3%82%8F%E3%82%8A+%E6%8C%87%E5%AE%BF%E5%B8%82";
</script>
</body>
</html>
