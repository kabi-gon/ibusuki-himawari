<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指宿ひまわり開花情報</title>
<style>
:root{--green:#287747;--soft:#f5f7f2;--text:#243127;--muted:#6f786f}
*{box-sizing:border-box}
body{margin:0;background:#edf0ec;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.phone{max-width:430px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 30px #0002}
.hero{height:390px;position:relative;color:#fff;background:linear-gradient(#0002,#0009),url("https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=1200&q=88") center/cover}
.header{padding:18px;display:flex;justify-content:space-between;font-weight:800}
.heroText{position:absolute;left:20px;right:20px;bottom:25px}
.heroText small{letter-spacing:.12em}.heroText h1{font-size:31px;line-height:1.18;margin:8px 0}.heroText p{margin:0;font-size:14px}
main{padding:22px 17px 95px}.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;margin:0 0 13px}.muted{font-size:11px;color:var(--muted)}
.feature{overflow:hidden;border-radius:20px;background:var(--soft);border:1px solid #e7ebe5}.featureImg{height:205px;background:center/cover no-repeat}.featureBody{padding:15px}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#e2f1e5;color:var(--green);font-size:12px;font-weight:800}.feature h2{font-size:20px;margin:8px 0 4px}.feature p{margin:0;color:#68736b;font-size:13px;line-height:1.6}
.info{margin-top:25px}.spotlink{text-decoration:none;color:inherit;display:block}.spot{display:flex;align-items:center;padding:14px 12px;border:1px solid #e4e8e3;border-radius:15px;margin:9px 0;background:#fff}.dot{width:11px;height:11px;border-radius:50%;margin-right:11px;flex:0 0 auto}.spot strong{font-size:14px}.spot small{display:block;color:#778078;font-size:11px;margin-top:3px;line-height:1.45}.rate{margin-left:auto;font-size:12px;white-space:nowrap}.arrow{margin-left:8px;color:#9aa39a}
.mapbox{margin-top:25px}
.maphead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
.mapnote{font-size:10px;color:#7a837b}
.map{height:285px;border-radius:20px;position:relative;overflow:hidden;border:1px solid #dce5d9;background:linear-gradient(135deg,#e9f1e6,#ddebe1)}
.map .lake{position:absolute;left:8%;top:10%;width:31%;height:28%;background:#b9dce3;border-radius:50%;opacity:.95}
.road{position:absolute;height:8px;background:#fff;box-shadow:0 0 0 1px #d2dad0;border-radius:5px}
.road.r1{width:120%;left:-13%;top:31%;transform:rotate(28deg)}
.road.r2{width:125%;left:-16%;top:62%;transform:rotate(-15deg)}
.zone{position:absolute;font-size:10px;color:#6f786f;background:#ffffffd8;padding:4px 7px;border:1px solid #e1e5df;border-radius:9px;z-index:2;white-space:nowrap}
.zone.lake-label{left:11%;top:8%}
.zone.south-label{right:7%;bottom:7%}
.mappin{position:absolute;z-index:4;text-decoration:none;transform:translate(-50%,-50%)}
.pinemoji{display:block;font-size:27px;text-align:center;line-height:1}
.pinlabel{display:block;margin-top:3px;background:#fff;color:#263229;border:1px solid #dfe5de;border-radius:9px;padding:4px 7px;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px #0001}
.mappin.ikeda .pinlabel{margin-left:22px;margin-top:-23px}
.mappin.nishioyama .pinlabel{margin-left:-42px}
.mappin.okachiyogamizu .pinlabel{margin-left:-42px}
.north{position:absolute;right:13px;top:12px;font-size:10px;font-weight:700;color:#6f786f;background:#ffffffd8;padding:4px 7px;border:1px solid #e1e5df;border-radius:8px;z-index:2}
.mapbuttons{display:grid;gap:8px;margin-top:12px}
.mapbtn{display:flex;justify-content:space-between;align-items:center;text-decoration:none;border:1px solid #dfe5de;border-radius:13px;padding:12px 13px;background:#fff;color:#2c382e;font-size:13px;font-weight:800}
.mapbtn small{display:block;font-weight:500;color:#7a837b;margin-top:2px;font-size:10px}.mapbtn .go{color:var(--green);font-size:17px}
.guide{margin-top:24px;padding:14px;border-radius:15px;background:#f7f8f5;border:1px solid #e4e8e3;font-size:12px;line-height:1.7}.guide b{font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e4e8e3;padding:9px 3px 11px;z-index:10}nav div{text-align:center;color:#788179;font-size:10px}nav b{display:block;font-size:18px;color:var(--green);margin-bottom:2px}
@media(min-width:500px){.phone{margin:24px auto;border-radius:28px;overflow:hidden}nav{position:sticky;left:auto;transform:none}}
</style>
</head>
<body>
<div class="phone">
<section class="hero">
  <div class="header"><span>🌻 指宿ひまわり開花情報</span><span>☰</span></div>
  <div class="heroText"><small>IBUSUKI · KAGOSHIMA</small><h1>今日、どこが<br>見ごろ？</h1><p>指宿市内のひまわりを、ひとつのサイトに。</p></div>
</section>

<main>
  <div class="row"><h2 class="title">🌻 今日の一枚</h2><span class="muted" id="siteUpdated"></span></div>
  <article class="feature">
    <div class="featureImg" id="mainPhoto"></div>
    <div class="featureBody">
      <span class="pill" id="mainStatus"></span>
      <h2 id="mainPlace"></h2>
      <p id="mainComment"></p>
    </div>
  </article>

  <section class="info">
    <div class="row"><h2 class="title">現在の開花状況</h2><span class="muted">3スポット</span></div>
    <div id="spots"></div>
  </section>

  <section class="mapbox">
    <div class="maphead">
      <h2 class="title" style="margin-bottom:0">📍 ひまわりマップ</h2>
      <span class="mapnote">※位置関係を示す簡易図</span>
    </div>

    <div class="map">
      <div class="lake"></div>
      <div class="road r1"></div>
      <div class="road r2"></div>
      <div class="zone lake-label">池田湖周辺</div>
      <div class="zone south-label">山川・開聞岳方面</div>
      <div class="north">北 ↑</div>

      <a class="mappin ikeda" href="https://www.google.com/maps/search/?api=1&query=31.2476792,130.5474680" target="_blank" rel="noopener"
         style="left:20%;top:22%">
        <span class="pinemoji">🌻</span><span class="pinlabel">池田湖</span>
      </a>

      <a class="mappin nishioyama" href="https://www.google.com/maps/search/?api=1&query=31.1904804,130.5769267" target="_blank" rel="noopener"
         style="left:66%;top:70%">
        <span class="pinemoji">📍</span><span class="pinlabel">JR西大山駅</span>
      </a>

      <a class="mappin okachiyogamizu" href="https://www.google.com/maps/search/?api=1&query=31.1826859,130.5839444" target="_blank" rel="noopener"
         style="left:82%;top:78%">
        <span class="pinemoji">📍</span><span class="pinlabel">山川岡児ケ水</span>
      </a>
    </div>

    <div class="mapbuttons">
      <a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=31.2476792,130.5474680" target="_blank" rel="noopener">
        <span>🌻 池田湖<small>中浜公民館の道路向かい</small></span><span class="go">›</span>
      </a>
      <a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=31.1904804,130.5769267" target="_blank" rel="noopener">
        <span>📍 JR西大山駅<small>駅周辺</small></span><span class="go">›</span>
      </a>
      <a class="mapbtn" href="https://www.google.com/maps/search/?api=1&query=31.1826859,130.5839444" target="_blank" rel="noopener">
        <span>📍 山川岡児ケ水<small>湯通堂青果の倉庫裏付近</small></span><span class="go">›</span>
      </a>
    </div>
  </section>

  <div class="guide">
    <b>📍 場所の目印</b><br>
    山川岡児ケ水：湯通堂青果の倉庫裏付近<br>
    池田湖：中浜公民館の道路向かい<br>
    JR西大山駅：駅周辺
  </div>
</main>

<nav><div><b>⌂</b>ホーム</div><div><b>🌻</b>開花情報</div><div><b>📍</b>マップ</div><div><b>📷</b>写真</div><div><b>＋</b>投稿</div></nav>
</div>

<script>
const DATA = {
  updated: "2026.8.8 更新",
  main: {
    place: "山川岡児ケ水",
    status: "● 見ごろ",
    comment: "湯通堂青果の倉庫裏付近。開聞岳とひまわりを一緒に楽しめる、指宿らしい夏の風景。",
    photo: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=1200&q=88"
  },
  spots: [
    {place:"山川岡児ケ水",landmark:"湯通堂青果の倉庫裏付近",status:"見ごろ",checked:"8/8確認",stars:"★★★★★",color:"#37a45b",map:"https://www.google.com/maps/search/?api=1&query=31.1826859,130.5839444"},
    {place:"池田湖",landmark:"中浜公民館の道路向かい",status:"まもなく見ごろ",checked:"8/7確認",stars:"★★★★☆",color:"#e4b632",map:"https://www.google.com/maps/search/?api=1&query=31.2476792,130.5474680"},
    {place:"JR西大山駅",landmark:"駅周辺",status:"咲き始め",checked:"8/7確認",stars:"★★☆☆☆",color:"#e78d3b",map:"https://www.google.com/maps/search/?api=1&query=31.1904804,130.5769267"}
  ]
};

document.getElementById("siteUpdated").textContent = DATA.updated;
document.getElementById("mainPlace").textContent = DATA.main.place;
document.getElementById("mainStatus").textContent = DATA.main.status;
document.getElementById("mainComment").textContent = DATA.main.comment;
document.getElementById("mainPhoto").style.backgroundImage = `url("${DATA.main.photo}")`;

const spots = document.getElementById("spots");
DATA.spots.forEach(s=>{
  const a = document.createElement("a");
  a.href=s.map; a.target="_blank"; a.rel="noopener"; a.className="spotlink";
  a.innerHTML=`<div class="spot">
    <i class="dot" style="background:${s.color}"></i>
    <div><strong>${s.place}</strong><small>${s.status} · ${s.checked}<br>📍 ${s.landmark}</small></div>
    <span class="rate">${s.stars}</span><span class="arrow">›</span>
  </div>`;
  spots.appendChild(a);
});
</script>
</body>
</html>
